name: DB STG package on merged PR

on:
  pull_request:
    branches: [ "staging" ]
    types: [ closed ]

permissions:
  contents: read

jobs:
  stg-package:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detectar carpetas del merge (solo lo que aportó el PR)
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"
          CHANGES=$(git diff --name-only "$BASE" "$MERGE" \
                   | grep '^db/migrations/' | cut -d/ -f1-3 | sort -u || true)
          {
            echo "changes<<__CHANGES__"
            echo "$CHANGES"
            echo "__CHANGES__"
          } >> "$GITHUB_OUTPUT"
          echo "$CHANGES"

      - name: Empaquetar STG (solo carpetas detectadas)
        if: steps.detect.outputs.changes != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts tmp
          SHORT="${{ github.event.pull_request.merge_commit_sha }}"; SHORT="${SHORT::7}"
          while read -r DIR; do
            [ -z "${DIR:-}" ] && continue
            ID=$(basename "$DIR")
            WORK="tmp/$ID"; mkdir -p "$WORK"
            [ -d "$DIR/install"  ] && cp -r "$DIR/install"  "$WORK/install"
            [ -d "$DIR/rollback" ] && cp -r "$DIR/rollback" "$WORK/rollback"
            [ -d "db/validaciones" ] && cp -r db/validaciones "$WORK/validaciones"
            NOW="$(date -u +%F_%H%M%SZ)"
            printf '%s\n' \
              "id=$ID" \
              "tipo=STG" \
              "pr=${{ github.event.pull_request.html_url }}" \
              "merge_sha=${{ github.event.pull_request.merge_commit_sha }}" \
              "fecha=${NOW}" \
              > "$WORK/MANIFEST.txt"
            (cd tmp && zip -r "../artifacts/STG-${ID}-${SHORT}.zip" "$ID")
            rm -rf "$WORK"
          done <<< "${{ steps.detect.outputs.changes }}"

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.changes != ''
        with:
          name: STG-db
          path: artifacts/*.zip
