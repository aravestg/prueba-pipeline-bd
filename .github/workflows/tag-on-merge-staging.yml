name: Tag en merge a staging (PAP)

on:
  pull_request:
    types: [closed]
    branches: [ "staging" ]

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear tag PAP-<rama>-<sha7>
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA7: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          SHORT=${SHA7:0:7}
          TAG="PAP-${HEAD_REF}-${SHORT}"
          git tag -a "$TAG" -m "Tag automático PAP para ${HEAD_REF} (${SHORT})"
          git push origin "$TAG"
