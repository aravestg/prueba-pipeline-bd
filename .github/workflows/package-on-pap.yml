name: DB PAP package on branch

on:
  push:
    branches: [ "PAP-*" ]

permissions:
  contents: read

jobs:
  pap-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detectar carpetas del último commit
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          CHANGES=$(git diff --name-only HEAD~1..HEAD \
                   | grep '^db/migrations/' | cut -d/ -f1-3 | sort -u || true)
          {
            echo "changes<<__CHANGES__"
            echo "$CHANGES"
            echo "__CHANGES__"
          } >> "$GITHUB_OUTPUT"
          echo "$CHANGES"

      - name: Empaquetar PAP (solo carpetas detectadas)
        if: steps.detect.outputs.changes != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts tmp
          SHORT="${GITHUB_SHA::7}"
          while read -r DIR; do
            [ -z "${DIR:-}" ] && continue
            ID=$(basename "$DIR")
            WORK="tmp/$ID"; mkdir -p "$WORK"
            [ -d "$DIR/install"  ] && cp -r "$DIR/install"  "$WORK/install"
            [ -d "$DIR/rollback" ] && cp -r "$DIR/rollback" "$WORK/rollback"
            [ -d "db/validaciones" ] && cp -r db/validaciones "$WORK/validaciones"
            NOW="$(date -u +%F_%H%M%SZ)"
            printf '%s\n' \
              "id=$ID" \
              "tipo=PAP" \
              "branch=${GITHUB_REF_NAME}" \
              "sha=${GITHUB_SHA}" \
              "fecha=${NOW}" \
              > "$WORK/MANIFEST.txt"
            (cd tmp && zip -r "../artifacts/PAP-${ID}-${SHORT}.zip" "$ID")
            rm -rf "$WORK"
          done <<< "${{ steps.detect.outputs.changes }}"

      - name: Checksums
        if: steps.detect.outputs.changes != ''
        run: (cd artifacts && shasum -a 256 *.zip > checksums.sha256)

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.changes != ''
        with:
          name: PAP-db
          path: artifacts/*
