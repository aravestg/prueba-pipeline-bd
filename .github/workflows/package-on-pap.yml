name: DB PAP package on branch

on:
  push:
    branches: [ "PAP-*" ]

permissions:
  contents: read
  actions: write

jobs:
  pap-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Detectar carpetas de cambio del último commit
        id: detect
        shell: bash
        run: |
          # En ramas PAP lo normal es cherry-pick del merge commit del PR
          CHANGES=$(git diff --name-only HEAD~1..HEAD \
                   | grep '^db/migrations/' | cut -d/ -f1-3 | sort -u || true)
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES"      >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT
          echo "$CHANGES"

      - name: Empaquetar PAP (solo carpetas detectadas)
        if: steps.detect.outputs.changes != ''
        shell: bash
        run: |
          mkdir -p artifacts tmp
          SHORT="${GITHUB_SHA::7}"
          while read -r DIR; do
            [ -z "$DIR" ] && continue
            ID=$(basename "$DIR")
            WORK="tmp/$ID"; mkdir -p "$WORK"
            [ -d "$DIR/install"  ] && cp -r "$DIR/install"  "$WORK/install"
            [ -d "$DIR/rollback" ] && cp -r "$DIR/rollback" "$WORK/rollback"
            [ -d "db/validaciones" ] && cp -r db/validaciones "$WORK/validaciones"
            cat > "$WORK/MANIFEST.txt" <<EOF
           id=$ID
           tipo=PAP
            branch=${GITHUB_REF_NAME}
           sha=${GITHUB_SHA}
            fecha=$(date -u +%F_%H%M%SZ)
           EOF
            (cd tmp && zip -r "../artifacts/PAP-${ID}-${SHORT}.zip" "$ID")
            rm -rf "$WORK"
          done <<< "${{ steps.detect.outputs.changes }}"

      - name: Checksums
        if: steps.detect.outputs.changes != ''
        run: (cd artifacts && shasum -a 256 *.zip > checksums.sha256)

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.changes != ''
        with:
          name: PAP-db
          path: artifacts/*
